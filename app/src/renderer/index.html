<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      手机适配的**地基**，缺一个都会出事：
        - width=device-width    不加的话 iOS/安卓按 980px 虚拟宽度排版，媒体查询命不中「窄屏」，
          手机上看到的是缩小版的桌面三栏（字小到看不清、按钮也点不准）；
        - initial-scale=1       同上，禁掉浏览器自作主张的"缩放适配"；
        - viewport-fit=cover    配合 CSS 的 env(safe-area-inset-*)，刘海屏/圆角屏下底部输入区才不被切掉。
      这份 index.html 同时被桌面 Electron 窗口和局域网网关（8886 的 /app/）使用；
      桌面窗口是固定尺寸的 BrowserWindow，这些 meta 对宽屏三栏布局没有任何影响。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; style-src 'self'; img-src 'self' data: http://127.0.0.1:* http://localhost:*; object-src 'self' data: blob:; frame-src 'self' data: blob:"
    />
    <title>AI 智学 · 测试窗口</title>
    <script src="kit/theme.js"></script>

    <!-- 样式：外壳 → 各视图自带的样式（新增功能在这里加一行 link） -->
    <link rel="stylesheet" href="shell/shell.css" />
    <link rel="stylesheet" href="views/calendar.css" />
    <link rel="stylesheet" href="views/lms.css" />
    <link rel="stylesheet" href="views/academic.css" />
    <link rel="stylesheet" href="views/notes/notes.css" />
    <link rel="stylesheet" href="views/auth.css" />
    <link rel="stylesheet" href="shell/theme.css" />
    <link rel="stylesheet" href="views/knowledge-settings.css" />
    <link rel="stylesheet" href="views/chat-hub.css" />
    <link rel="stylesheet" href="views/chat-settings.css" />
    <link rel="stylesheet" href="views/review.css" />
    <link rel="stylesheet" href="views/transfer.css" />
    <link rel="stylesheet" href="views/account.css" />
  </head>
  <body>
    <div class="app">
      <!-- 左侧功能栏（约 10% 宽）：内容由视图注册表生成 -->
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-name">智学</span>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="nav-grow"></div>
        <button type="button" id="theme-toggle" class="theme-toggle">☾ 夜间模式</button>
        <nav class="nav nav-bottom" id="nav-bottom"></nav>
      </aside>

      <!-- 中间对话面板 -->
      <section class="chat">
        <header class="chat-head">
          <span class="dot" id="dot" title="推送通道"></span>
          <h1 class="chat-title">对话</h1>
          <span class="badge badge-btn" id="ai-badge" role="button" tabindex="0" title="点击选择模型">AI 未接入</span>
          <span class="status-pill" id="status">正在连接后端…</span>
          <button class="panel-toggle" id="panel-toggle" type="button" title="收起右侧视图">⟩</button>
        </header>

        <div class="chat-log" id="chat-log"></div>

        <!--
          排队条：只在"上一轮还没答完、用户又发了消息"时出现（内存态，切会话即清空）。
          放在输入区**上方**：它是"等待发出的东西"，视觉上必须和输入框贴在一起，
          否则用户会以为那条消息已经发出去了。
        -->
        <div class="chat-queue" id="chat-queue" hidden></div>

        <div class="chat-compose">
          <button class="compose-plus" id="chat-attach" type="button" title="添加图片或文件">+</button>
          <textarea
            id="chat-input"
            rows="2"
            placeholder="用一句话添加日程 / 待办，例如：明天 15:00-16:00 项目周会"
            autocomplete="off"
            enterkeyhint="send"
            title="Enter 发送 · Shift + Enter 换行"
          ></textarea>
          <button class="primary-btn" id="chat-send" type="button">发送</button>
          <!--
            停止按钮：**与发送按钮同一个位置**，一轮在跑时顶替它出现。
            单独一个（而不是把「发送」改造成停止）是为了不让"点发送"和"点停止"共用同一个
            click 处理器 —— 一个按钮两种语义，迟早会出现"想停止却发出去一条消息"。
            图标是**方块**（■ 的 SVG 版本）：方形在全世界的播放器里都是"停止"，
            而且不依赖字体里有没有 ⏹ 这个字符。title/aria-label 都是「停止本轮」。
          -->
          <button class="stop-btn" id="chat-stop" type="button" title="停止本轮" aria-label="停止本轮" hidden>
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
              <rect x="3.5" y="3.5" width="9" height="9" rx="1.8" fill="currentColor" />
            </svg>
          </button>
        </div>
        <div class="chat-attachments" id="chat-attachments" hidden></div>
        <!-- 联网搜索 / 思考模式 / 权限 / 用量 / 绘图：菜单向上展开（绝对定位，展开时输入框那一行不动） -->
        <div class="chat-controls" id="chat-controls"></div>
        <input type="file" id="chat-files" multiple hidden />
      </section>

      <!-- 右侧功能视图 -->
      <section class="panel">
        <header class="panel-head">
          <h2 id="panel-title">日历</h2>
        </header>
        <div class="panel-body" id="panel-body"></div>
      </section>
    </div>

    <div id="toast" class="toast"></div>

    <!--
      脚本加载顺序（classic script，无构建步骤）：
        1) kit/        注册表与公共积木（纯工具，不依赖别的文件）
        2) shell/planned.js  规划中的占位页（真实实现登记同名 id 后会自动接管）
        3) views/      各业务模块的视图 —— **新增功能在这里加一行**
        4) shell/      外壳自带视图、图标表与外壳本体（外壳必须最后加载：启动时要读注册表）
    -->
    <script src="kit/registry.js"></script>
    <script src="kit/util.js"></script>
    <script src="kit/labels.js"></script>
    <script src="kit/dom.js"></script>
    <!-- 富文本：Markdown 子集 + LaTeX 子集 + ```svg 图形（零依赖，见 kit/richtext.js） -->
    <script src="kit/richtext.js"></script>

    <script src="shell/planned.js"></script>

    <script src="views/calendar.js"></script>
    <script src="views/lms.js"></script>
    <script src="views/academic.js"></script>
    <script src="views/notes/notes.js"></script>
    <!-- 全局登录只往「设置」里加一块卡片，不占左栏入口（见 views/auth-settings.js） -->
    <script src="views/auth-settings.js"></script>
    <!-- 知识库同样只占「设置」里的一块：语料概况 / 栏目表 / 重读索引 / 自检（见 views/knowledge-settings.js） -->
    <script src="views/knowledge-settings.js"></script>
    <!-- 「对话」页：AI 中枢（对话管理 / 记忆管理 / 知识库管理 / 定时唤醒），左栏第一项 -->
    <script src="views/chat-hub.js"></script>
    <!-- 联网检索的设置（开关 / 服务 / 密钥 / 最大条数 / 试搜自检）只占「设置」里一块 -->
    <script src="views/chat-settings.js"></script>
    <!-- 「复习」页：间隔重复卡片 / 学习目标与 DDL / 学习周报（三个标签一页） -->
    <script src="views/review.js"></script>
    <!-- 「传输」页：局域网直传（8886 端口，设备之间直传，不经服务器） -->
    <script src="views/transfer.js"></script>
    <!-- 账号登录只往「设置」里加一块卡片：后端做桥，页面拿不到会话令牌（见 views/account.js） -->
    <script src="views/account.js"></script>

    <script src="shell/icons.js"></script>
    <script src="shell/message.js"></script>
    <script src="shell/settings.js"></script>
    <script src="shell/app.js"></script>
  </body>
</html>
